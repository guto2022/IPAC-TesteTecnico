services:
  postgres:
    image: postgres:17
    container_name: ipac-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
  
  backend:
    build: ./backend
    container_name: ipac-backend
    restart: unless-stopped

    ports:
      - "3000:3000"

    environment:
      DATABASE_URL: ${DATABASE_URL}
    
    depends_on:
      - postgres


  frontend:
    build: ./frontend
    container_name: ipac-frontend
    restart: unless-stopped

    ports:
      - "5173:5173"

    depends_on:
      - backend


volumes:
  postgres_data: